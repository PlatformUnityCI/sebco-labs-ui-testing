[pytest]

addopts = -p no:warnings -rA -v --tb=short --html=./reports/report.html --self-contained-html

log_cli = true
log_level = INFO
log_format = %(asctime)s | %(levelname)s >>> %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

norecursedirs = 
    mutants 
    .git 
    .venv 
    __pycache__ 
    .pytest_cache

pythonpath = .

markers =
    regression: regression suite
    smoke: smoke tests
    ui: UI tests